# stack=uv → .depot/workflows/gerbang.yml
# Gerbang terkini di Depot CI (mesin jauh) — dipanggil oleh ~/bin/gerbang-depot.sh (autopilot gerbang_jauh / deploy), bukan push/PR.
# Dijana `~/bin/depot-workflow.sh` dari ~/ops/depot/templat/gerbang-uv.yml (stack: Python + uv, uv.lock; pelayar Playwright).
# ⚠ Sandbox memaksa warna: ujian yang mencari teks output CLI perlu NO_COLOR. Tiada rahsia; pelari Depot TIADA /etc/machine-id.
name: gerbang
on: workflow_dispatch
jobs:
  gerbang:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    env:
      NO_COLOR: "1"
      CI: "1"
      TERM: dumb
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - run: uv sync --frozen
      - run: uv run --frozen playwright install --with-deps chromium webkit || true
      - run: bash scripts/gerbang-ujian.sh
