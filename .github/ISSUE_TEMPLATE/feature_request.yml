name: Feature request
description: Suggest an improvement, a new rule category or a new country pack
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: sources
    attributes:
      label: Official sources (for a new pack or category)
      description: Government or regulator domains that state the rule.
