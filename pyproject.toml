[project]
name = "terkini"
version = "0.1.0"
description = "Checks AI answers about Malaysian rules against official government sources, through Tavily and a Bifrost gateway."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30",
]

[project.scripts]
terkini = "terkini.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terkini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
